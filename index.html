<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e12" />
  <title>Evoke</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="loading" class="loading" role="status" aria-live="polite">
    <img src="logo.svg" alt="Evoke" class="loading-logo" />
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <p class="loading-text" id="loading-text">Entering Evoke...</p>
    <button class="btn btn-primary" id="retry" hidden onclick="location.reload()">Try again</button>
    <noscript><p class="loading-text">Evoke needs JavaScript enabled.</p></noscript>
  </div>
  <div id="app" class="app" hidden>
    <header class="nav"><div class="nav-inner">
      <a href="#/" class="brand" aria-label="Evoke home"><img src="logo.svg" alt="" width="30" height="30" /><span>EVOKE</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Main">
        <a href="#/" class="nav-link" data-route="home">Home</a>
        <a href="#/discover" class="nav-link" data-route="discover">Discover</a>
        <a href="#/create" class="nav-link" data-route="create">Create</a>
        <div class="nav-auth-mobile">
          <button class="btn btn-ghost" data-auth="login">Log In</button>
          <button class="btn btn-primary" data-auth="signup">Sign Up</button>
        </div>
      </nav>
      <div class="nav-right">
        <form class="search" id="search" role="search">
          <button type="button" class="icon-btn search-toggle" id="search-toggle" aria-label="Toggle search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          <input type="search" id="search-input" aria-label="Search games" placeholder="Search games" />
        </form>
        <div class="nav-auth">
          <button class="btn btn-ghost" data-auth="login">Log In</button>
          <button class="btn btn-primary" data-auth="signup">Sign Up</button>
        </div>
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </div></header>
    <main class="main" id="main"></main>
    <footer class="footer"><div class="footer-inner">
      <a href="#/" class="brand small-brand"><img src="logo.svg" alt="" width="22" height="22" /><span>EVOKE</span></a>
      <nav aria-label="Footer" class="footer-links">
        <a href="#/about">About</a><a href="#/guidelines">Community Guidelines</a><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a>
      </nav>
      <p class="muted small">© <span id="year"></span> Evoke. All rights reserved.</p>
    </div></footer>
    <div id="modal"></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
